services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: patunganku-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?isi di infra/.env}"
      MSSQL_PID: "Developer"
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    container_name: patunganku-azurite
    command: "azurite --skipApiVersionCheck --blobHost 0.0.0.0 --blobPort 10000 --queueHost 0.0.0.0 --queuePort 10001 --location /data"
    ports:
      - "127.0.0.1:10000:10000"
      - "127.0.0.1:10001:10001"
    volumes:
      - azurite-data:/data

volumes:
  mssql-data:
  azurite-data:
