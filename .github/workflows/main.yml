name: Patunganku CI - Build and Test

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install Dependencies
        run: |
          if [ -f package.json ]; then
            npm ci || npm install
          else
            echo "package.json belum ada, melewati langkah instalasi dependensi."
          fi

      - name: Run Linting / Automated Tests
        run: |
          if [ -f package.json ]; then
            npm test --if-present
          else
            echo "package.json belum ada, melewati automated test."
          fi

      - name: Build Application
        run: |
          if [ -f package.json ]; then
            npm run build --if-present
          else
            echo "package.json belum ada, verifikasi struktur repo sukses."
          fi