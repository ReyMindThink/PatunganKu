name: PatunganKu CI - Build and Test

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Install Dependencies
        run: |
          if [ -f apps/backend/package.json ]; then
            cd apps/backend
            npm ci || npm install
          else
            echo "apps/backend belum ada, melewati instalasi."
          fi

      - name: Lint
        run: |
          if [ -f apps/backend/package.json ]; then
            cd apps/backend
            npm run lint --if-present
          else
            echo "Backend belum ada, melewati lint."
          fi

      - name: Test
        run: |
          if [ -f apps/backend/package.json ]; then
            cd apps/backend
            npm test --if-present
          else
            echo "Backend belum ada, melewati test."
          fi
